# Docker Compose Definition for Windows (Docker Desktop)
# Usage: docker compose -f docker-compose.windows.yml up --build

version: "3.8"

services:
  manga-dup-finder:
    image: manga-dup-finder:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manga-dup-finder-windows
    environment:
      - SCAN_PATHS=/media/manga,/media/doujinshi
      - OUTPUT_DIR=/reports
      - DETECT_PARTIALS=true
      - REPORT_FORMAT=html,json,csv
    volumes:
      # Map Windows local drives / folders to container POSIX mount paths
      # e.g., G:\LX\Manga -> /media/manga (read-only)
      - "G:/LX/Manga:/media/manga:ro"
      - "G:/LX/Doujinshi:/media/doujinshi:ro"
      - "./reports:/reports"
      - "./config.example.yaml:/app/config.yaml:ro"
