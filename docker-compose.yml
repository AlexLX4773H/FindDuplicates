# CasaOS App Specification & Docker Compose Definition
# Project: FindDuplicates - Manga & Doujinshi Duplicate Finder
version: "3.8"

services:
  manga-dup-finder:
    image: manga-dup-finder:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manga-dup-finder
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - TZ=UTC
      - SCAN_PATHS=/media/manga,/media/doujinshi
      - OUTPUT_DIR=/reports
      - ARCHIVE_DIR=/archive
      - DETECT_PARTIALS=true
      - MIN_PAGE_RATIO=0.6
      - REPORT_FORMAT=html,json,csv
    volumes:
      # Map CasaOS storage paths (Adjust to your CasaOS drive paths, e.g., /DATA/Media/Manga)
      - /DATA/Media/Manga:/media/manga:ro
      - /DATA/Media/Doujinshi:/media/doujinshi:ro
      # Report output folder
      - ./reports:/reports
      # Target archive folder for moving duplicates
      - ./archive:/archive
      # Optional external configuration file
      - ./config.yaml:/app/config.yaml:ro
    labels:
      icon: "https://raw.githubusercontent.com/Alex/Find-Duplicates/main/assets/icon.png"

# CasaOS App Store Metadata & Dashboard UI Settings
x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: manga-dup-finder
  port_map: "8765"
  index: "/"
  scheme: "http"
  description:
    en_us: "Interactive duplicate finder and chapter manager for Manga, Manhwa, and Doujinshi collections. Features intra-series and global cross-directory duplicate detection, perceptual image hashing, and a click-and-confirm UI to archive or delete duplicates."
  tagline:
    en_us: "Manga & Doujinshi Interactive Duplicate Finder"
  developer: "Alex"
  author: "Alex"
  icon: "https://raw.githubusercontent.com/Alex/Find-Duplicates/main/assets/icon.png"
  thumbnail: "https://raw.githubusercontent.com/Alex/Find-Duplicates/main/assets/banner.png"
  screenshot_link:
    - "https://raw.githubusercontent.com/Alex/Find-Duplicates/main/assets/banner.png"
  title:
    en_us: "FindDuplicates"
  category: "Utilities"
