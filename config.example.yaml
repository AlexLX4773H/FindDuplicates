# FindDuplicates Configuration
# Paths can be Windows drive letters (G:\LX\Manga), UNC shares (\\NAS\Manga),
# or Linux / CasaOS paths (/media/manga, /sg2b/Share2sgb/Manga).

manga:
  scan_paths:
    - "/media/manga"
    - "/sg2b/Share2sgb/Manga"
  detect_fractional: true
  min_page_ratio: 0.60
  supported_archives: [".cbz", ".zip", ".cbr", ".rar"]

doujinshi:
  scan_paths:
    - "/media/doujinshi"
    - "/media/devmon/L500/Vere NewFolder"
  fuzzy_threshold: 88
  cross_directory: true
  leaf_chapter_names: ["chapter", "_chapter", "read the chapter"]

image_inspection:
  enabled: true
  hash_algorithm: "dhash" # dhash or phash
  hash_size: 8
  hamming_threshold: 6
  cache_directory: "./cache"

output:
  report_directory: "./reports"
  formats: ["terminal", "html", "json", "csv"]
